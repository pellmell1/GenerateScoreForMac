# 애플실리콘(arm64) Mac용 .app 빌드 — GitHub의 애플실리콘 Mac 서버(macos-14)에서 만든다(2026-10-27).
# 이 저장소의 Mac(인텔)에서는 arm64를 교차 빌드할 수 없어서(BUILD.md). 결과는 실행 화면 아래 "Artifacts"의
# 중주연습-mac-arm64(.zip)로 내려받는다. main에 올릴 때마다, 또는 Actions 탭에서 "Run workflow"로 직접 돌린다.
name: Mac 애플실리콘 빌드

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14          # 애플실리콘(M1) — 여기서 빌드해야 arm64 네이티브
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 패키지 설치
        run: python -m pip install -r requirements.txt pyinstaller

      - name: 단위 테스트
        run: python -m unittest discover -s tests

      - name: 아이콘(assets/ensemble.icns)
        run: python make_icon.py

      - name: 빌드
        run: python -m PyInstaller --noconfirm --distpath dist-mac --workpath build-mac "중주연습 1.3 mac.spec"

      - name: arm64인지·서명 확인
        run: |
          file "dist-mac/중주연습 1.3.app/Contents/MacOS/ensemble"
          file "dist-mac/중주연습 1.3.app/Contents/MacOS/ensemble" | grep -q arm64
          codesign --verify --deep --strict "dist-mac/중주연습 1.3.app"

      - name: 압축(ditto — 서명·실행 권한 유지)
        run: ditto -c -k --keepParent "dist-mac/중주연습 1.3.app" "중주연습-1.3-mac-arm64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: 중주연습-mac-arm64
          path: 중주연습-1.3-mac-arm64.zip
          retention-days: 30
